# =============================================================================
#  LIFEGEAR 樂奇浴室暖風機 lifegear-bath-heat — 取代原廠面板
#  https://github.com/xangin/esphome-lifegear-bath-heat
# -----------------------------------------------------------------------------
#  接線 (原廠面板拆除, ESP 直連機器):
#    ESP GPIO19 ──→ 排線「TX」(原面板送出端 → 機器 RX)  以 1Hz 持續送出狀態幀, ESP 即 master
#    排線「RX」 ──→ ESP GPIO4  (機器 TX → 原面板接收端)  RMT 硬體擷取, 解機器回報
#    GND 共地; ESP 請用獨立電源 (USB 5V)。
#
#  所有 Home Assistant 實體都由元件原生提供, 不需要任何 lambda;
#  不要的實體直接刪掉那一段即可。開機預設送「關機」狀態。
#  需要 wifi_ssid / wifi_password 兩個 secrets。
# =============================================================================
substitutions:
  LAST_UPDATE: "26.09.28"
  devicename: lifegear-bath-heat
  friendly_name: "Lifegear 浴室暖風機"

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  comment: "SimonIoT Lifegear 浴室暖風機"
  project:
    name: "SimonIoT.LifegearBathHeat"
    version: ${LAST_UPDATE}

esp32:
  board: esp32dev
  # ESP32-C3 改用下面兩行; C3 的 GPIO18/19 是 USB, 腳位請改用例如 GPIO3 / GPIO4
  # variant: esp32c3
  # board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source: github://xangin/esphome-lifegear-bath-heat@main
    components: [ lifegear_bath_heat ]
    refresh: 1d

wifi:
  reboot_timeout: 5min
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${devicename}
    password: "12345678"

captive_portal:

logger:
  level: DEBUG
  baud_rate: 115200

api:
  reboot_timeout: 10min

ota:
  - platform: esphome

# =============================================================================
#  暖風機
# =============================================================================
lifegear_bath_heat:
  id: bath_heat
  machine_tx_pin: 19    # → 排線 TX (機器 RX)
  rmt_rx_pin: 4         # ← 排線 RX (機器 TX)
  display_language: zh-TW   # zh-TW 或 en: 模式與狀態字串語言
  # 各模式預設定時 (分鐘, 5-720); 宣告了對應的 number 實體後以 HA 設定值為準
  # timer_defaults:
  #   heat_bath: 60
  #   heat_temp: 60
  #   cool_high: 60
  #   cool_low: 60
  #   vent_high: 60
  #   vent_low: 180
  #   dry_eco: 180
  #   dry_fast: 60

select:
  - platform: lifegear_bath_heat
    lifegear_bath_heat_id: bath_heat
    mode:
      name: "Mode 模式"
      icon: mdi:hvac
    heat_temperature:
      name: "Heat Temp 溫控溫度"
      icon: mdi:thermometer
    filter_threshold:
      name: "Filter Limit 濾網時數"
      icon: mdi:air-filter
      entity_category: config

number:
  - platform: lifegear_bath_heat
    lifegear_bath_heat_id: bath_heat
    heat_bath_timer:
      name: "Bath Timer 沐浴定時"
      icon: mdi:timer-outline
      entity_category: config
      mode: box
    heat_temp_timer:
      name: "Heat Timer 溫控定時"
      icon: mdi:timer-outline
      entity_category: config
      mode: box
    cool_high_timer:
      name: "Cool Hi Timer 涼風強定時"
      icon: mdi:timer-outline
      entity_category: config
      mode: box
    cool_low_timer:
      name: "Cool Lo Timer 涼風弱定時"
      icon: mdi:timer-outline
      entity_category: config
      mode: box
    vent_high_timer:
      name: "Vent Hi Timer 換氣強定時"
      icon: mdi:timer-outline
      entity_category: config
      mode: box
    vent_low_timer:
      name: "Vent Lo Timer 換氣弱定時"
      icon: mdi:timer-outline
      entity_category: config
      mode: box
    dry_eco_timer:
      name: "Eco Dry Timer 節電乾燥定時"
      icon: mdi:timer-outline
      entity_category: config
      mode: box
    dry_fast_timer:
      name: "Fast Dry Timer 快速乾燥定時"
      icon: mdi:timer-outline
      entity_category: config
      mode: box

switch:
  - platform: lifegear_bath_heat
    lifegear_bath_heat_id: bath_heat
    left_light:
      name: "Left Light 左燈"
      icon: mdi:lightbulb
      restore_mode: ALWAYS_OFF
    right_light:
      name: "Right Light 右燈"
      icon: mdi:lightbulb-outline
      restore_mode: ALWAYS_OFF
    buzzer:
      name: "Buzzer 蜂鳴"
      icon: mdi:bell-ring
      restore_mode: RESTORE_DEFAULT_ON
    vent24:
      name: "Vent24 24h換氣"
      icon: mdi:hours-24
      restore_mode: RESTORE_DEFAULT_OFF

button:
  - platform: lifegear_bath_heat
    lifegear_bath_heat_id: bath_heat
    "off":
      name: "Off 關機"
      icon: mdi:power
    filter_reset:
      name: "Filter Reset 濾網重設"
      icon: mdi:air-filter
      entity_category: config
  - platform: restart
    name: "Restart 重開機"
  - platform: factory_reset
    name: "Factory Reset 恢復出廠"
    internal: true

sensor:
  - platform: lifegear_bath_heat
    lifegear_bath_heat_id: bath_heat
    filter_hours:
      name: "Filter Hours 濾網時數"
      icon: mdi:air-filter
    timer_left:
      name: "Timer Left 剩餘時間"
      icon: mdi:timer-sand
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: internal_temperature
    name: "ESP32 Temperature"
  - platform: uptime
    name: "Uptime 開機時間"

text_sensor:
  - platform: lifegear_bath_heat
    lifegear_bath_heat_id: bath_heat
    current_mode:
      name: "Mode State 目前模式"
      icon: mdi:information-outline
    host_status:
      name: "Host 主機回報"
      icon: mdi:engine-outline
    raw_state:
      name: "Raw State 原始狀態"
      icon: mdi:code-braces
      entity_category: diagnostic
      disabled_by_default: true
  - platform: version
    name: "ESPHome Version"
  - platform: wifi_info
    ip_address:
      name: "IP Address"

binary_sensor:
  - platform: lifegear_bath_heat
    lifegear_bath_heat_id: bath_heat
    filter_due:
      name: "Filter Due 濾網清潔"
      icon: mdi:air-filter
      device_class: problem
    left_light_state:
      name: "Left State 左燈狀態"
      entity_category: diagnostic
      disabled_by_default: true
    right_light_state:
      name: "Right State 右燈狀態"
      entity_category: diagnostic
      disabled_by_default: true
  - platform: status
    name: "Status 連線狀態"
