# Guition ESP32-S3-4848S040 顯示、觸控、背光與字型

ota:
  - platform: esphome
    on_begin:
      - light.turn_off:
          id: display_backlight
          transition_length: 0s

# =============================================================================
output:
  - platform: ledc
    id: backlight_output
    pin: GPIO38
    frequency: 150Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    name: "Panel Backlight 面板背光"
    id: display_backlight
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    # HA 直接關閉背光時也必須立刻暫停 LVGL，避免第一下觸控穿透。
    on_turn_off:
      - lambda: |-
          id(panel_screen_awake) = false;
          id(panel_last_touch_ms) = millis();
      - lvgl.pause:
          show_snow: false
    # HA 直接開啟背光時恢復畫面；由喚醒腳本開啟時則由腳本自行恢復，
    # 避免在「首次觸控僅喚醒」的保護時間內提早接收觸控。
    on_turn_on:
      - if:
          condition:
            lambda: return !id(panel_screen_awake);
          then:
            - lambda: |-
                id(panel_screen_awake) = true;
                id(panel_last_touch_ms) = millis();
            - delay: 250ms
            - lvgl.resume

spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

i2c:
  - id: touchscreen_bus
    sda: GPIO19
    scl:
      number: GPIO45
      ignore_strapping_warning: true

display:
  - platform: st7701s
    id: tft_display
    dimensions:
      width: 480
      height: 480
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: false
    cs_pin: GPIO39
    de_pin: GPIO18
    hsync_pin: GPIO16
    vsync_pin: GPIO17
    pclk_pin: GPIO21
    pclk_frequency: 12MHz
    pclk_inverted: false
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    update_interval: never
    auto_clear_enabled: false
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCD, 0x00]
    data_pins:
      red: [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue: [4, 5, 6, 7, 15]

touchscreen:
  - platform: gt911
    id: tft_touch
    display: tft_display
    on_touch:
      - lambda: id(panel_last_touch_ms) = millis();
      - if:
          condition:
            lambda: |-
              // 以背光的實際狀態做第二層保護，涵蓋 HA 關閉與狀態同步競速。
              if (!id(display_backlight).current_values.is_on())
                id(panel_screen_awake) = false;
              return !id(panel_screen_awake);
          then:
            - script.execute: wake_panel_screen

