# 面板啟動、狀態記憶、時鐘與週期更新

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            // 保留 WiFi 掃描結果 (esphome 連線成功後預設會清空, 清單頁會撿不到)
            if (wifi::global_wifi_component != nullptr)
              wifi::global_wifi_component->set_keep_scan_results(true);
            auto call = id(display_backlight).turn_on();
            call.set_brightness(id(panel_brightness_pct) / 100.0f);
            call.set_transition_length(0);
            call.perform();
            id(panel_screen_awake) = true;
            id(panel_last_touch_ms) = millis();
        - delay: 1s
        - script.execute: refresh_panel_ui

globals:
  - id: last_heat_mode
    type: int
    restore_value: true
    initial_value: "0"
  - id: last_cool_mode
    type: int
    restore_value: true
    initial_value: "2"
  - id: last_vent_mode
    type: int
    restore_value: true
    initial_value: "4"
  - id: last_dry_mode
    type: int
    restore_value: true
    initial_value: "6"
  - id: last_normal_mode
    type: int
    restore_value: true
    initial_value: "4"
  - id: active_normal_mode
    type: int
    restore_value: false
    initial_value: "-1"
  - id: panel_brightness_pct
    type: int
    restore_value: true
    initial_value: "70"
  - id: panel_sleep_index
    type: int
    restore_value: true
    initial_value: "4" # 5 分鐘
  - id: panel_wake_touch_only
    type: bool
    restore_value: true
    initial_value: "true"
  - id: panel_auto_home_index
    type: int
    restore_value: true
    initial_value: "3" # 3 分鐘
  - id: panel_screen_awake
    type: bool
    restore_value: false
    initial_value: "true"
  - id: panel_last_touch_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: countdown_colon_on
    type: bool
    restore_value: false
    initial_value: "true"
  - id: countdown_hold_until_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: countdown_hold_max_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: countdown_wait_fresh
    type: bool
    restore_value: false
    initial_value: "false"
  - id: home_popup_open
    type: bool
    restore_value: false
    initial_value: "false"
  - id: filter_threshold_draft
    type: int
    restore_value: false
    initial_value: "0"
  - id: wifi_setup_selected_ssid
    type: std::string
    restore_value: false
  - id: filter_popup_dirty
    type: bool
    restore_value: false
    initial_value: "false"
  - id: settings_is_open
    type: bool
    restore_value: false
    initial_value: "false"
  - id: settings_dirty
    type: bool
    restore_value: false
    initial_value: "false"
  - id: settings_loading
    type: bool
    restore_value: false
    initial_value: "false"
  - id: settings_active_tab
    type: int
    restore_value: false
    initial_value: "0" # 0定時 1設定 2資訊
  - id: timer_settings_page
    type: int
    restore_value: false
    initial_value: "0"
  - id: timer_draft_0
    type: int
    restore_value: false
    initial_value: "60"
  - id: timer_draft_1
    type: int
    restore_value: false
    initial_value: "30"
  - id: timer_draft_2
    type: int
    restore_value: false
    initial_value: "30"
  - id: timer_draft_3
    type: int
    restore_value: false
    initial_value: "20"
  - id: timer_draft_4
    type: int
    restore_value: false
    initial_value: "20"
  - id: timer_draft_5
    type: int
    restore_value: false
    initial_value: "20"
  - id: timer_draft_6
    type: int
    restore_value: false
    initial_value: "30"
  - id: timer_draft_7
    type: int
    restore_value: false
    initial_value: "20"
  - id: settings_brightness_draft
    type: int
    restore_value: false
    initial_value: "70"
  - id: settings_sleep_draft
    type: int
    restore_value: false
    initial_value: "4"
  - id: settings_wake_touch_draft
    type: bool
    restore_value: false
    initial_value: "true"
  - id: settings_auto_home_draft
    type: int
    restore_value: false
    initial_value: "3"
  - id: settings_heat_temp_draft
    type: int
    restore_value: false
    initial_value: "5"
  - id: settings_buzzer_draft
    type: bool
    restore_value: false
    initial_value: "true"

