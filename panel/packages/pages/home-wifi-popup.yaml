# 網路資訊彈窗：主機名稱、IP、SSID、訊號、HA、MAC
obj:
  id: wifi_popup
  x: 0
  y: 0
  width: 480
  height: 480
  bg_color: 0x000000
  bg_opa: 80%
  clickable: true
  scrollable: false
  hidden: true
  widgets:
    - obj:
        x: 32
        y: 68
        width: 416
        height: 344
        radius: 14
        bg_color: 0x111111
        bg_opa: COVER
        border_color: 0x8A8A8A
        border_width: 2
        widgets:
          - label:
              x: 28
              y: 18
              width: 360
              height: 36
              text: "網路連線"
              text_font: settings_zh_24
              text_align: CENTER
          - obj:
              x: 14
              y: 58
              width: 388
              height: 1
              bg_color: 0x454545
              bg_opa: COVER
          - label:
              x: 28
              y: 66
              width: 118
              height: 30
              text: "Hostname"
              text_font: settings_en_20
          - label:
              id: wifi_popup_hostname
              x: 150
              y: 68
              width: 240
              height: 30
              text: "--"
              text_font: settings_en_16
              text_align: RIGHT
          - label:
              x: 28
              y: 102
              width: 118
              height: 30
              text: "IP"
              text_font: settings_en_20
          - label:
              id: wifi_popup_ip
              x: 150
              y: 102
              width: 240
              height: 30
              text: "--"
              text_font: settings_en_20
              text_align: RIGHT
          - label:
              id: wifi_popup_ssid_label
              x: 28
              y: 138
              width: 118
              height: 30
              text: "SSID"
              text_font: settings_en_20
          - label:
              id: wifi_popup_ap_label
              x: 28
              y: 136
              width: 118
              height: 30
              text: "熱點名稱"
              text_font: settings_zh_20
              hidden: true
          - label:
              id: wifi_popup_ssid
              x: 150
              y: 140
              width: 240
              height: 30
              text: "--"
              text_font: settings_en_16
              text_align: RIGHT
          - label:
              id: wifi_popup_rssi_label
              x: 28
              y: 174
              width: 118
              height: 30
              text: "WiFi"
              text_font: settings_en_20
          - label:
              id: wifi_popup_pw_label
              x: 28
              y: 172
              width: 118
              height: 30
              text: "熱點密碼"
              text_font: settings_zh_20
              hidden: true
          - label:
              id: wifi_popup_rssi
              x: 150
              y: 174
              width: 150
              height: 30
              text: "-- dBm"
              text_font: settings_en_20
              text_align: RIGHT
          - label:
              id: wifi_popup_quality
              x: 304
              y: 174
              width: 86
              height: 28
              text: "未連線"
              text_font: settings_zh_16
              text_align: RIGHT
          - label:
              x: 28
              y: 210
              width: 118
              height: 30
              text: "HA"
              text_font: settings_en_20
          - label:
              id: wifi_popup_ha
              x: 150
              y: 208
              width: 240
              height: 30
              text: "未連線"
              text_font: settings_zh_20
              text_align: RIGHT
          - label:
              x: 28
              y: 246
              width: 118
              height: 30
              text: "MAC"
              text_font: settings_en_20
          - label:
              id: wifi_popup_mac
              x: 150
              y: 246
              width: 240
              height: 30
              text: "--"
              text_font: settings_en_20
              text_align: RIGHT
          - button:
              id: wifi_popup_setup_button
              x: 14
              y: 286
              width: 190
              height: 44
              radius: 10
              bg_color: 0x292929
              border_color: 0x777777
              border_width: 1
              shadow_opa: TRANSP
              on_click:
                - script.execute: wifi_setup_entry
              widgets:
                - label:
                    id: wifi_popup_setup_label
                    align: CENTER
                    text: "選擇網路"
                    text_font: settings_zh_20
          - button:
              id: wifi_popup_close_button
              x: 252
              y: 286
              width: 150
              height: 44
              radius: 10
              bg_color: 0x292929
              border_color: 0x777777
              border_width: 1
              shadow_opa: TRANSP
              on_click:
                - script.execute: close_home_popups
              widgets:
                - label:
                    align: CENTER
                    text: "關閉"
                    text_font: settings_zh_20
