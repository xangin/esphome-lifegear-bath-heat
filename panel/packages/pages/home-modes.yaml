obj:
  id: home_modes_layer
  x: 0
  y: 0
  width: 480
  height: 480
  bg_opa: TRANSP
  border_width: 0
  pad_all: 0
  clickable: false
  scrollable: false
  widgets:
    # ---------------------------------------------------------------------
    # 四張模式卡完全以 LVGL 繪製。關機時為深灰立體卡面，只有運轉中的
    # 卡片套用原本的模式色；左右選擇塊仍保留各模式最後一次選項。
    # ---------------------------------------------------------------------
    - button:
        id: dry_mode_button
        x: 8
        y: 88
        width: 228
        height: 184
        radius: 12
        bg_color: 0x343434
        bg_grad_color: 0x141414
        bg_grad_dir: VER
        bg_opa: COVER
        border_width: 0
        outline_width: 0
        shadow_opa: TRANSP
        pad_all: 0
        scrollable: false
        clickable: true
        on_click:
          - lambda: |-
              int next = id(last_dry_mode);
              if (id(active_normal_mode) == 6 || id(active_normal_mode) == 7)
                next = (id(active_normal_mode) == 6) ? 7 : 6;
              id(last_dry_mode) = next;
              id(last_normal_mode) = next;
              id(active_normal_mode) = next;
              id(bath_heat)->cmd_mode(next == 6 ? "dry_eco" : "dry_fast");
              id(refresh_panel_ui).execute();
        widgets:
          - obj:
              x: 20
              y: 16
              width: 188
              height: 42
              radius: 21
              bg_color: 0x0C0C0C
              bg_opa: COVER
              border_color: 0x5A5A5A
              border_width: 1
              pad_all: 0
              clickable: false
              scrollable: false
              widgets:
                - obj:
                    id: dry_mode_switch_thumb
                    x: 2
                    y: 2
                    width: 92
                    height: 38
                    radius: 19
                    bg_color: 0x5A5A5A
                    bg_grad_color: 0x303030
                    bg_grad_dir: VER
                    bg_opa: COVER
                    border_color: 0x777777
                    border_width: 1
                    clickable: false
                - label:
                    id: dry_eco_label
                    x: 4
                    y: 8
                    width: 88
                    height: 28
                    text: "節電"
                    text_font: panel_font_22
                    text_align: CENTER
                    clickable: false
                - label:
                    id: dry_fast_label
                    x: 98
                    y: 8
                    width: 86
                    height: 28
                    text: "快速"
                    text_font: panel_font_22
                    text_align: CENTER
                    clickable: false
          - label:
              id: dry_mode_icon
              x: 84
              y: 69
              width: 60
              height: 54
              text: "\U000F0599"
              text_font: panel_mdi_54
              text_color: 0x777777
              text_align: CENTER
              clickable: false
          - label:
              id: dry_mode_title
              x: 66
              y: 130
              width: 96
              height: 42
              text: "乾燥"
              text_font: panel_font_30
              text_align: CENTER
              clickable: false
          - obj:
              x: 18
              y: 14
              width: 96
              height: 48
              bg_opa: TRANSP
              border_width: 0
              clickable: true
              scrollable: false
              on_click:
                - lambda: |-
                    id(last_dry_mode) = 6;
                    id(last_normal_mode) = 6;
                    id(active_normal_mode) = 6;
                    id(bath_heat)->cmd_mode("dry_eco");
                    id(refresh_panel_ui).execute();
          - obj:
              x: 114
              y: 14
              width: 96
              height: 48
              bg_opa: TRANSP
              border_width: 0
              clickable: true
              scrollable: false
              on_click:
                - lambda: |-
                    id(last_dry_mode) = 7;
                    id(last_normal_mode) = 7;
                    id(active_normal_mode) = 7;
                    id(bath_heat)->cmd_mode("dry_fast");
                    id(refresh_panel_ui).execute();

