    # ---------------------------------------------------------------------
    # 中央電源採參考設計的三層結構：黑色嵌槽、模式色 arc、深色內圓。
    # 運轉中關閉；關閉／僅 24H 時恢復最後正常模式。
    # ---------------------------------------------------------------------
    - button:
        id: center_power_button
        x: 162
        y: 198
        width: 156
        height: 156
        radius: 78
        bg_color: 0x000000
        bg_opa: COVER
        border_width: 0
        outline_width: 0
        shadow_opa: TRANSP
        pad_all: 0
        scrollable: false
        clickable: true
        on_click:
          - lambda: |-
              static const char *const MODE_KEYS[8] = {
                "heat_bath", "heat_temp", "cool_hi", "cool_lo",
                "vent_hi", "vent_lo", "dry_eco", "dry_fast"
              };
              if (id(active_normal_mode) >= 0 && id(active_normal_mode) < 8) {
                id(last_normal_mode) = id(active_normal_mode);
                id(active_normal_mode) = -1;
                id(bath_heat)->request_off();
              } else {
                int mode = id(last_normal_mode);
                if (mode < 0 || mode > 7) mode = 4;
                id(active_normal_mode) = mode;
                id(bath_heat)->cmd_mode(MODE_KEYS[mode]);
              }
              id(refresh_panel_ui).execute();
        widgets:
          - arc:
              id: center_power_mode_arc
              align: CENTER
              width: 136
              height: 136
              start_angle: 0
              end_angle: 360
              arc_width: 5
              arc_color: 0x626262
              arc_rounded: false
              adjustable: false
              adv_hittest: false
              clickable: false
              hidden: false

          - obj:
              id: center_power_inner
              align: CENTER
              width: 108
              height: 108
              radius: 54
              bg_color: 0x2D2D33
              bg_opa: COVER
              border_width: 0
              shadow_opa: TRANSP
              pad_all: 0
              clickable: false
              scrollable: false
              widgets:
                - label:
                    id: center_power_icon
                    align: CENTER
                    y: 2
                    width: 74
                    height: 58
                    text: "\U000F0425"
                    text_font: panel_mdi_54
                    text_color: 0xFFFFFF
                    text_align: CENTER
                    clickable: false
                    scrollable: false
                - label:
                    id: center_countdown_label
                    align: CENTER
                    width: 104
                    height: 36
                    text: "--:--"
                    text_font: panel_digits_30
                    text_color: 0xFFFFFF
                    text_align: CENTER
                    recolor: true
                    hidden: true
                    clickable: false
                    scrollable: false
