# 已連線時按「重設網路」的二次確認
obj:
  id: wifi_reset_confirm
  x: 0
  y: 0
  width: 480
  height: 480
  bg_color: 0x000000
  bg_opa: 80%
  clickable: true
  scrollable: false
  hidden: true
  widgets:
    - obj:
        x: 32
        y: 140
        width: 416
        height: 200
        radius: 14
        bg_color: 0x111111
        bg_opa: COVER
        border_color: 0x8A8A8A
        border_width: 2
        widgets:
          - label:
              x: 28
              y: 26
              width: 360
              height: 36
              text: "是否要重設網路"
              text_font: settings_zh_24
              text_align: CENTER
          - label:
              x: 28
              y: 74
              width: 360
              height: 28
              text: "目前連線會中斷"
              text_font: settings_zh_20
              text_color: 0xBEBEBE
              text_align: CENTER
          - button:
              id: wifi_reset_yes_button
              x: 60
              y: 122
              width: 140
              height: 56
              radius: 10
              bg_color: 0x342020
              border_color: 0xB84A4A
              border_width: 1
              shadow_opa: TRANSP
              on_click:
                - script.execute: wifi_reset_and_rescan
              widgets:
                - label:
                    align: CENTER
                    text: "是"
                    text_font: settings_zh_20
          - button:
              id: wifi_reset_cancel_button
              x: 216
              y: 122
              width: 140
              height: 56
              radius: 10
              bg_color: 0x292929
              border_color: 0x777777
              border_width: 1
              shadow_opa: TRANSP
              on_click:
                - lvgl.widget.hide: wifi_reset_confirm
              widgets:
                - label:
                    align: CENTER
                    text: "否"
                    text_font: settings_zh_20
