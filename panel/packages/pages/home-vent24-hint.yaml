# 24h 換氣單點提示（短按時出現 1.5 秒）
obj:
  id: vent24_hint
  x: 80
  y: 92
  width: 320
  height: 50
  radius: 25
  bg_color: 0x202020
  bg_opa: COVER
  border_color: 0x8A8A8A
  border_width: 1
  shadow_opa: TRANSP
  pad_all: 0
  clickable: false
  scrollable: false
  hidden: true
  widgets:
    - label:
        id: vent24_hint_label
        align: CENTER
        text: "請長按兩秒開啟"
        text_font: settings_zh_20
        text_color: 0xFFFFFF
        text_align: CENTER
