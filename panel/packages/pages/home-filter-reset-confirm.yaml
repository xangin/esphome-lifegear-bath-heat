# 濾網重置二次確認
obj:
  id: filter_reset_confirm
  x: 0
  y: 0
  width: 480
  height: 480
  bg_color: 0x000000
  bg_opa: 80%
  clickable: true
  scrollable: false
  hidden: true
  widgets:
    - obj:
        x: 32
        y: 140
        width: 416
        height: 200
        radius: 14
        bg_color: 0x111111
        bg_opa: COVER
        border_color: 0x8A8A8A
        border_width: 2
        widgets:
          - label:
              x: 28
              y: 26
              width: 360
              height: 36
              text: "是否要重置"
              text_font: settings_zh_24
              text_align: CENTER
          - label:
              x: 28
              y: 74
              width: 360
              height: 28
              text: "濾網累計運轉時數"
              text_font: settings_zh_20
              text_color: 0xBEBEBE
              text_align: CENTER
          - button:
              x: 60
              y: 122
              width: 140
              height: 56
              radius: 10
              bg_color: 0x342020
              border_color: 0xB84A4A
              border_width: 1
              on_click:
                - script.execute: confirm_filter_reset
              widgets:
                - label:
                    align: CENTER
                    text: "重置"
                    text_font: settings_zh_20
          - button:
              id: filter_reset_cancel_button
              x: 216
              y: 122
              width: 140
              height: 56
              radius: 10
              bg_color: 0x292929
              border_color: 0x777777
              border_width: 1
              on_click:
                - lvgl.widget.hide: filter_reset_confirm
              widgets:
                - label:
                    align: CENTER
                    text: "取消"
                    text_font: settings_zh_20
