# 面板上直接選 WiFi：掃描清單頁（wifi_setup_page）與密碼輸入頁（wifi_pw_page）
obj:
  id: wifi_setup_layer
  x: 0
  y: 0
  width: 480
  height: 480
  bg_opa: TRANSP
  border_width: 0
  pad_all: 0
  clickable: false
  scrollable: false
  widgets:
    - obj:
        id: wifi_setup_page
        x: 0
        y: 0
        width: 480
        height: 480
        bg_color: 0x050505
        bg_opa: COVER
        clickable: true
        scrollable: false
        hidden: true
        widgets:
          - button:
              id: wifi_setup_back_button
              x: 8
              y: 8
              width: 116
              height: 50
              radius: 10
              bg_color: 0x171717
              border_color: 0x555555
              border_width: 1
              shadow_opa: TRANSP
              pad_all: 0
              on_click:
                - script.execute: close_home_popups
              widgets:
                - label:
                    x: 8
                    y: 8
                    width: 34
                    height: 34
                    text: "\U000F0731"
                    text_font: settings_mdi_34
                    text_align: CENTER
                - label:
                    x: 40
                    y: 14
                    width: 64
                    height: 30
                    text: "返回"
                    text_font: settings_zh_20
                    text_align: CENTER
          - label:
              x: 150
              y: 20
              width: 160
              height: 34
              text: "選擇網路"
              text_font: settings_zh_24
              text_align: CENTER
          - button:
              id: wifi_rescan_button
              x: 330
              y: 8
              width: 142
              height: 50
              radius: 10
              bg_color: 0x171717
              border_color: 0x555555
              border_width: 1
              shadow_opa: TRANSP
              on_click:
                - lambda: |-
                    auto *wc = wifi::global_wifi_component;
                    if (wc == nullptr) return;
                    if (wc->is_connected()) {
                      // 已連線: disable/enable 重啟連線流程, esphome 自己會先做一次
                      // 完整掃描 (清單每 2 秒撿 get_scan_result), 之後自動連回原網路。
                      // 不可在 enable() 後立刻 start_scanning(): radio 未就緒會失敗
                      // 並卡 30 秒 timeout (26.09.13 踩過)。
                      wc->disable();
                      wc->enable();
                    } else {
                      wc->start_scanning();
                    }
                    lv_label_set_text(id(wifi_setup_status), "掃描中");
                - script.execute: refresh_wifi_setup_list
              widgets:
                - label:
                    align: CENTER
                    text: "重新掃描"
                    text_font: settings_zh_20
          - label:
              id: wifi_setup_status
              x: 16
              y: 66
              width: 448
              height: 28
              text: "掃描中"
              text_font: settings_zh_16
              text_color: 0xBEBEBE
          - button:
              id: wifi_row_0
              x: 8
              y: 96
              width: 464
              height: 56
              radius: 10
              bg_color: 0x171717
              border_color: 0x555555
              border_width: 1
              shadow_opa: TRANSP
              hidden: true
              on_click:
                - lambda: id(wifi_setup_selected_ssid) = lv_label_get_text(id(wifi_row_ssid_0));
                - script.execute: open_wifi_pw_page
              widgets:
                - label:
                    id: wifi_row_ssid_0
                    x: 11
                    y: 12
                    width: 330
                    height: 30
                    text: "-"
                    text_font: settings_en_20
                - label:
                    id: wifi_row_qual_0
                    x: 355
                    y: 11
                    width: 88
                    height: 30
                    text: ""
                    text_font: wifi_qual_zh_20
                    text_align: RIGHT
